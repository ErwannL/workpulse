name: Déploiement GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub Pages doit être activé à la main dans les réglages du dépôt
  # (Settings → Pages → source « GitHub Actions »). Tant que ce n'est pas fait,
  # le déploiement est ignoré plutôt que signalé en échec : c'est une décision
  # du propriétaire du dépôt, pas une régression du code.
  verifier:
    name: Pages est-il activé ?
    runs-on: ubuntu-latest
    outputs:
      actif: ${{ steps.pages.outputs.actif }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "actif=true" >> "$GITHUB_OUTPUT"
          else
            echo "actif=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Déploiement ignoré'
              echo ''
              echo 'GitHub Pages n’est pas activé sur ce dépôt.'
              echo 'Pour l’activer : Settings → Pages → source « GitHub Actions ».'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publier:
    name: Compiler et publier la PWA
    runs-on: ubuntu-latest
    needs: verifier
    if: needs.verifier.outputs.actif == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compiler le domaine puis l'application
        run: |
          npm run build:core
          npm run build --workspace @workpulse/web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - id: deploiement
        uses: actions/deploy-pages@v5
