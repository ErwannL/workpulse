name: Déploiement GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    name: Compiler et publier la PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compiler le domaine puis l'application
        run: |
          npm run build:core
          npm run build --workspace @workpulse/web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deploiement
        uses: actions/deploy-pages@v4
