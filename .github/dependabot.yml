version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # Trois montées majeures sont volontairement différées, pour les raisons
    # écrites dans l'issue #13 : NestJS 12 exige TypeScript 6, et Vitest 4
    # change la mesure de couverture au point de révéler des chemins que la
    # version précédente comptait à tort comme couverts. Les rouvrir chaque
    # semaine ne ferait que noyer les mises à jour qui, elles, se prennent.
    #
    # Ces lignes sautent le jour où l'issue est traitée. Elles ne masquent
    # aucun avis de sécurité : Dependabot les remonte indépendamment.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=6']
      - dependency-name: 'vitest'
        versions: ['>=4']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=4']
      - dependency-name: 'vite'
        versions: ['>=8']
      - dependency-name: '@nestjs/*'
        versions: ['>=12']
      - dependency-name: 'prisma'
        versions: ['>=7']
      - dependency-name: '@prisma/client'
        versions: ['>=7']
      # L'enveloppe Android : une majeure ne se prend pas sans un essai sur un
      # vrai téléphone, ce que la chaîne ne sait pas faire.
      - dependency-name: '@capacitor/*'
        versions: ['>=8']
    groups:
      # Un lot par famille : cinq pull requests séparées pour React seraient
      # ingérables, et les paquets d'une même famille bougent ensemble.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      outillage:
        patterns:
          [
            'vite*',
            'vitest',
            '@vitest/*',
            'eslint*',
            'typescript*',
            'prettier',
            '@testing-library/*',
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
