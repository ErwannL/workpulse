# Pile de développement : PostgreSQL et l'API de synchronisation.
# L'application web, elle, tourne sans rien de tout cela (`npm run dev`).
services:
  postgres:
    image: postgres:17-alpine
    container_name: workpulse-postgres
    environment:
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse
      POSTGRES_DB: workpulse
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workpulse']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: workpulse-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://workpulse:workpulse@postgres:5432/workpulse?schema=public
      PORT: '3000'
      CORS_ORIGINS: http://localhost:5173
      SWAGGER_ENABLED: 'true'
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres-data:
